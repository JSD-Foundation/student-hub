<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduSphere Student Portal</title>

    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="fgWDtSmtrFiRd7HblJOrkAX373FhECm5pZNpU7S6sHw" />
</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen" class="login-screen">

    <div class="login-container">

        <div class="login-image">
            <div class="login-overlay">
                <h1>EduSphere</h1>
                <p>Student Academic Management Portal</p>

                <div class="login-features">
                    <div>
                        <i class="fa-solid fa-user-graduate"></i>
                        <span>Students</span>
                    </div>

                    <div>
                        <i class="fa-solid fa-chalkboard-user"></i>
                        <span>Teachers</span>
                    </div>

                    <div>
                        <i class="fa-solid fa-user-tie"></i>
                        <span>Mentors</span>
                    </div>

                    <div>
                        <i class="fa-solid fa-user-shield"></i>
                        <span>Admin</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="login-box">

            <div class="logo-circle">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <h2>Welcome Back</h2>
            <p class="login-subtitle">Sign in to your portal</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="loginRole">
                        <i class="fa-solid fa-users"></i>
                        Login As
                    </label>

                    <select id="loginRole" required>
                        <option value="">Select Role</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher / Mentor</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="input-group">

                    <label for="loginUsername">
                        <i class="fa-solid fa-user"></i>
                        Username / Roll Number
                    </label>

                    <input
                        type="text"
                        id="loginUsername"
                        placeholder="Enter username or roll number"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="loginPassword">
                        <i class="fa-solid fa-lock"></i>
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>

                <button type="submit" class="btn btn-primary login-btn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login
                </button>

                <p id="loginMessage" class="login-message"></p>

            </form>

        </div>

    </div>

</div>


<!-- =========================
     MAIN APPLICATION
========================= -->

<div id="app" class="app hidden">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-logo">

            <div class="sidebar-logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <div>
                <h2>EduSphere</h2>
                <small>Academic Portal</small>
            </div>

        </div>

        <div class="user-mini-profile">

            <div class="user-avatar" id="sidebarAvatar">
                JD
            </div>

            <div>
                <strong id="sidebarName">User</strong>
                <span id="sidebarRole">Student</span>
            </div>

        </div>

        <nav class="sidebar-nav" id="sidebarNav"></nav>

        <div class="sidebar-bottom">

            <button class="sidebar-btn" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main-content">

        <!-- TOPBAR -->

        <header class="topbar">

            <button class="mobile-menu-btn" id="mobileMenuBtn">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div>

                <h1 id="pageTitle">Dashboard</h1>

                <p id="pageSubtitle">
                    Academic Management Portal
                </p>

            </div>

            <div class="topbar-right">

                <button class="icon-button">
                    <i class="fa-regular fa-bell"></i>
                    <span class="notification-dot"></span>
                </button>

                <div class="topbar-user">

                    <div class="user-avatar small" id="topbarAvatar">
                        JD
                    </div>

                    <div>
                        <strong id="topbarName">User</strong>
                        <span id="topbarRole">Student</span>
                    </div>

                </div>

            </div>

        </header>


        <!-- PAGE CONTENT -->

        <section class="content-area" id="contentArea"></section>

    </main>

</div>


<!-- =========================
     MODAL
========================= -->

<div id="modalOverlay" class="modal-overlay hidden">

    <div class="modal">

        <div class="modal-header">

            <div>
                <h2 id="modalTitle">Modal</h2>
                <p id="modalSubtitle"></p>
            </div>

            <button
                class="modal-close"
                id="modalClose"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <div id="modalBody"></div>

    </div>

</div>


<!-- TOAST -->

<div id="toast" class="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMessage">Success</span>
</div>


<script src="script.js"></script>

</body>
</html>
